
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d1c">
<title>Turbo Rivals | Online Car Soccer</title>

<style>
:root {
  --bg:#080d1c;
  --panel:#111d32;
  --blue:#36baff;
  --orange:#ff914d;
  --text:#f4f8ff;
  --muted:#8c9bb5;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Inter,system-ui,Arial,sans-serif;
 overflow:hidden;user-select:none;
}
button{
 border:0;border-radius:12px;padding:14px 22px;
 background:linear-gradient(120deg,#2388ff,#36c9f4);
 color:white;font-weight:900;font-size:14px;
 cursor:pointer;touch-action:manipulation;
}
button:disabled{opacity:.45;cursor:not-allowed}
.screen{
 position:fixed;inset:0;display:flex;
 align-items:center;justify-content:center;padding:20px;
 background:radial-gradient(ellipse at 50% 15%,#1a355b,#080d1c 75%);
}
.hidden{display:none!important}
.menu{width:min(460px,100%);text-align:center}
.logo{
 font-size:clamp(38px,10vw,65px);
 font-weight:1000;letter-spacing:-4px;line-height:1;
}
.logo span{color:var(--blue)}
.subtitle{
 color:var(--muted);letter-spacing:4px;
 font-size:11px;margin:14px 0 25px;
}
.panel{
 background:rgba(19,31,53,.94);
 border:1px solid #263c5b;border-radius:20px;
 padding:25px;margin-top:15px;
 box-shadow:0 20px 80px #0008;
}
.panel h2{margin:0 0 10px}
.small{color:var(--muted);font-size:12px;line-height:1.6}
input{
 width:100%;padding:14px;border-radius:10px;
 border:1px solid #344663;background:#080f20;
 color:white;margin:12px 0;font-size:16px;
}
.status{color:var(--blue);font-size:13px;margin:15px 0}
#game{
 position:fixed;inset:0;background:#07101f;
}
canvas{width:100%;height:100%;display:block}
.hud{
 position:absolute;top:15px;left:50%;
 transform:translateX(-50%);
 display:flex;align-items:center;gap:18px;
 padding:10px 22px;background:#0b1426e8;
 border:1px solid #344b6a;border-radius:14px;
 font-weight:900;white-space:nowrap;
}
.blue{color:var(--blue)}
.orange{color:var(--orange)}
#clock{font-size:23px}
#exit{
 position:absolute;top:15px;left:15px;
 background:#253650;padding:10px 15px;
}
.controls{
 position:absolute;bottom:20px;left:0;right:0;
 display:flex;justify-content:space-between;
 padding:0 24px;pointer-events:none;
}
.control-group{display:flex;gap:12px;align-items:end}
.ctrl{
 pointer-events:auto;width:65px;height:65px;
 border-radius:50%;background:#192d49e8;
 border:2px solid #52708e;display:grid;
 place-items:center;font-size:13px;font-weight:900;
 touch-action:none;
}
.ctrl.jump{background:#1764a9e8;border-color:#58baff}
.ctrl.boost{background:#a94b19e8;border-color:#ffad60}
#message{
 position:absolute;top:25%;left:50%;
 transform:translateX(-50%);
 font-size:clamp(24px,5vw,48px);
 font-weight:1000;text-shadow:0 5px 20px black;
 pointer-events:none;white-space:nowrap;
}
#fuel{
 position:absolute;bottom:100px;right:25px;
 width:110px;height:8px;border-radius:9px;
 background:#26344c;overflow:hidden;
}
#fuelbar{height:100%;width:100%;background:#ff9c43}
#leaveStatus{
 position:absolute;bottom:12px;left:50%;
 transform:translateX(-50%);
 color:white;font-size:11px;
}
@media(max-width:600px){
 .hud{top:12px;gap:10px;padding:8px 13px}
 .controls{bottom:18px;padding:0 12px}
 .ctrl{width:58px;height:58px}
 #fuel{bottom:91px}
}
</style>
</head>

<body>

<div id="menu" class="screen">
 <div class="menu">
  <div class="logo">TURBO<span>RIVALS</span></div>
  <div class="subtitle">ONLINE ARCADE CAR SOCCER</div>

  <div class="panel">
   <h2>ENTER THE ARENA</h2>
   <p class="small">Drive. Fly. Score. Dominate.</p>

   <input id="nickname" maxlength="16"
    placeholder="Your player name" value="Racer">

   <button id="play" style="width:100%" disabled>
    FIND ONLINE MATCH
   </button>

   <div id="status" class="status">
    Connecting to Firebase...
   </div>

   <p class="small">
    WASD / ARROWS: Drive<br>
    SPACE: Jump · SHIFT: Boost
   </p>
  </div>

  <p class="small">TURBO RIVALS · ORIGINAL GAME</p>
 </div>
</div>

<div id="game" class="hidden">
 <canvas id="canvas"></canvas>

 <button id="exit">EXIT</button>

 <div class="hud">
  <span class="blue" id="blueScore">BLUE 0</span>
  <span id="clock">02:00</span>
  <span class="orange" id="orangeScore">ORANGE 0</span>
 </div>

 <div id="message"></div>

 <div id="fuel"><div id="fuelbar"></div></div>

 <div class="controls">
  <div class="control-group">
   <div class="ctrl" data-key="left">◀</div>
   <div class="ctrl" data-key="right">▶</div>
  </div>
  <div class="control-group">
   <div class="ctrl jump" data-key="jump">JUMP</div>
   <div class="ctrl boost" data-key="boost">BOOST</div>
  </div>
 </div>

 <div id="leaveStatus"></div>
</div>

<script type="module">
import {initializeApp}
 from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {getAuth,signInAnonymously,onAuthStateChanged}
 from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
 getDatabase,ref,get,set,update,push,remove,
 onValue,runTransaction,onDisconnect
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

/* ==========================================
   FIREBASE CONFIGURATION
========================================== */

const firebaseConfig = {
 apiKey:"AIzaSyDZT_d5peCD3aiHWlLjK8W7Ct2f5Z3_r2I",
 authDomain:"rock-league-swipe.firebaseapp.com",
 databaseURL:"https://rock-league-swipe-default-rtdb.firebaseio.com",
 projectId:"rock-league-swipe",
 storageBucket:"rock-league-swipe.firebasestorage.app",
 messagingSenderId:"450830531157",
 appId:"1:450830531157:web:ef25a0a89d71e0520432dc",
 measurementId:"G-DJHLY3FH8G"
};

/* ==========================================
   OPTIONAL GITHUB ARTWORK
   Replace empty strings with direct image URLs.
========================================== */

const ASSETS={
 blueCar:"",
 orangeCar:"",
 arena:"",
 ball:""
};

const images={};

for(const [key,url] of Object.entries(ASSETS)){
 if(!url)continue;
 const img=new Image();
 img.crossOrigin="anonymous";
 img.src=url;
 images[key]=img;
}

/* ==========================================
   FIREBASE
========================================== */

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

const $=id=>document.getElementById(id);

let user=null;
let connected=false;
let roomId=null;
let roomRef=null;
let slot=0;
let isHost=false;
let roomData=null;
let unsubscribe=null;
let searching=false;
let active=false;
let matchEnded=false;
let waitTimer=null;
let presenceRef=null;

function status(message){
 $("status").textContent=message;
}

function playerName(){
 return $("nickname").value.trim().slice(0,16)||"Racer";
}

onAuthStateChanged(auth,async currentUser=>{
 if(currentUser){
  user=currentUser;
  connected=true;

  try{
   presenceRef=ref(db,"presence/"+user.uid);
   await onDisconnect(presenceRef).remove();
   await set(presenceRef,{
    online:true,
    lastSeen:Date.now()
   });

   $("play").disabled=false;
   status("Connected · Ready to play");
  }catch(error){
   status("Database error: "+error.message);
  }
 }else{
  connected=false;
  $("play").disabled=true;
  status("Signing in...");
  signInAnonymously(auth).catch(error=>{
   status("Authentication error: "+error.message);
  });
 }
});

window.addEventListener("beforeunload",()=>{
 if(presenceRef)remove(presenceRef).catch(()=>{});
});

/* ==========================================
   MATCHMAKING
========================================== */

async function findMatch(){
 if(!connected||!user||searching||active)return;

 searching=true;
 $("play").disabled=true;
 status("Searching for an opponent...");

 try{
  const snapshot=await get(ref(db,"rooms"));
  let joined=false;

  if(snapshot.exists()){
   const rooms=snapshot.val();

   for(const [id,room] of Object.entries(rooms)){
    if(room.status!=="waiting")continue;

    const target=ref(db,"rooms/"+id);

    const result=await runTransaction(target,current=>{
     if(!current||current.status!=="waiting")return;

     current.players=current.players||{};

     if(current.players[user.uid])return current;
     if(Object.keys(current.players).length>=2)return;

     current.players[user.uid]={
      uid:user.uid,
      name:playerName(),
      slot:1,
      x:1370,
      y:480,
      vx:0,
      vy:0,
      angle:Math.PI,
      boost:100
     };

     current.status="playing";
     current.startedAt=Date.now();
     current.ball=current.ball||{
      x:800,y:280,vx:0,vy:0
     };
     current.score=current.score||{
      blue:0,orange:0
     };
     current.timeLeft=120;

     return current;
    });

    if(result.committed&&result.snapshot.exists()){
     const data=result.snapshot.val();

     if(data.players?.[user.uid]){
      roomId=id;
      roomRef=target;
      slot=1;
      isHost=false;
      joined=true;
      break;
     }
    }
   }
  }

  if(!joined){
   const newRoom=push(ref(db,"rooms"));

   roomId=newRoom.key;
   roomRef=newRoom;
   slot=0;
   isHost=true;

   await set(roomRef,{
    status:"waiting",
    hostUid:user.uid,
    createdAt:Date.now(),
    players:{
     [user.uid]:{
      uid:user.uid,
      name:playerName(),
      slot:0,
      x:230,
      y:480,
      vx:0,
      vy:0,
      angle:0,
      boost:100
     }
    },
    ball:{x:800,y:280,vx:0,vy:0},
    score:{blue:0,orange:0},
    timeLeft:120
   });

   await onDisconnect(
    ref(db,`rooms/${roomId}/players/${user.uid}`)
   ).remove();

   status("Room created · Waiting for opponent...");
   waitForOpponent();
  }else{
   startMatch();
  }
 }catch(error){
  console.error(error);
  status("Matchmaking error: "+error.message);
  searching=false;
  $("play").disabled=false;
 }
}

function waitForOpponent(){
 clearInterval(waitTimer);

 waitTimer=setInterval(async()=>{
  if(!roomRef){
   clearInterval(waitTimer);
   return;
  }

  try{
   const snapshot=await get(roomRef);

   if(!snapshot.exists()){
    clearInterval(waitTimer);
    searching=false;
    status("Room closed. Try again.");
    $("play").disabled=false;
    return;
   }

   const data=snapshot.val();

   if(data.status==="playing"){
    clearInterval(waitTimer);
    startMatch();
   }
  }catch(error){
   console.error(error);
  }
 },1000);
}

$("play").addEventListener("click",findMatch);

/* ==========================================
   GAME STATE
========================================== */

const canvas=$("canvas");
const ctx=canvas.getContext("2d");

const W=1600,H=900;

let scale=1;
let offsetX=0;
let offsetY=0;

function resize(){
 canvas.width=innerWidth*devicePixelRatio;
 canvas.height=innerHeight*devicePixelRatio;

 scale=Math.min(canvas.width/W,canvas.height/H);

 offsetX=(canvas.width-W*scale)/2;
 offsetY=(canvas.height-H*scale)/2;
}
window.addEventListener("resize",resize);
resize();

let me={
 x:230,y:480,vx:0,vy:0,angle:0,
 boost:100,onGround:true,jumpHeld:false
};

let ball={x:800,y:280,vx:0,vy:0};
let players={};
let scores={blue:0,orange:0};
let timeLeft=120;

const keys={};

const keyMap={
 ArrowLeft:"left",
 a:"left",
 ArrowRight:"right",
 d:"right",
 ArrowUp:"jump",
 w:"jump",
 " ":"jump",
 Shift:"boost"
};

window.addEventListener("keydown",event=>{
 const k=keyMap[event.key]||keyMap[event.key.toLowerCase()];

 if(k){
  keys[k]=true;
  event.preventDefault();
 }
});

window.addEventListener("keyup",event=>{
 const k=keyMap[event.key]||keyMap[event.key.toLowerCase()];
 if(k)keys[k]=false;
});

document.querySelectorAll(".ctrl").forEach(el=>{
 const k=el.dataset.key;

 el.addEventListener("pointerdown",event=>{
  event.preventDefault();
  keys[k]=true;
  el.setPointerCapture(event.pointerId);
 });

 ["pointerup","pointercancel","lostpointercapture"].forEach(type=>{
  el.addEventListener(type,()=>keys[k]=false);
 });
});

/* ==========================================
   START MATCH
========================================== */

function startMatch(){
 if(active)return;

 clearInterval(waitTimer);

 searching=false;
 active=true;
 matchEnded=false;

 $("menu").classList.add("hidden");
 $("game").classList.remove("hidden");

 me={
  x:slot===0?230:1370,
  y:480,
  vx:0,vy:0,
  angle:slot===0?0:Math.PI,
  boost:100,
  onGround:true,
  jumpHeld:false
 };

 if(unsubscribe)unsubscribe();

 unsubscribe=onValue(roomRef,snapshot=>{
  if(!snapshot.exists()){
   leaveMatch(false);
   return;
  }

  roomData=snapshot.val();

  players=roomData.players||{};
  ball=roomData.ball||ball;
  scores=roomData.score||scores;
  timeLeft=roomData.timeLeft??120;

  updateHUD();

  if(roomData.status==="finished"){
   finishMatch();
  }

  if(roomData.status==="waiting"&&slot===1){
   leaveMatch(false);
  }
 });

 previous=0;
 requestAnimationFrame(loop);
}

function updateHUD(){
 $("blueScore").textContent="BLUE "+(scores.blue||0);
 $("orangeScore").textContent="ORANGE "+(scores.orange||0);

 const seconds=Math.max(0,timeLeft|0);

 $("clock").textContent=
  String(Math.floor(seconds/60)).padStart(2,"0")+":"+
  String(seconds%60).padStart(2,"0");

 $("fuelbar").style.width=me.boost+"%";
}

/* ==========================================
   PLAYER PHYSICS
========================================== */

function updateCar(dt){
 const left=keys.left;
 const right=keys.right;

 if(left)me.vx-=0.3*dt*60;
 if(right)me.vx+=0.3*dt*60;

 me.vx*=Math.pow(0.985,dt*60);
 me.vx=Math.max(-11,Math.min(11,me.vx));

 if(keys.jump&&!me.jumpHeld&&me.onGround){
  me.vy=-13;
  me.onGround=false;
 }

 me.jumpHeld=keys.jump;

 if(keys.boost&&me.boost>0){
  me.vx+=(slot===0?0.22:-0.22)*dt*60;
  me.vy-=0.16*dt*60;
  me.boost=Math.max(0,me.boost-0.9*dt*60);
 }else{
  me.boost=Math.min(100,me.boost+0.2*dt*60);
 }

 me.vy+=0.55*dt*60;
 me.x+=me.vx*dt*60;
 me.y+=me.vy*dt*60;

 if(me.y>H-125){
  me.y=H-125;
  me.vy=0;
  me.onGround=true;
 }

 if(me.y<65){
  me.y=65;
  me.vy=0;
 }

 me.x=Math.max(65,Math.min(W-65,me.x));

 if(Math.abs(me.vx)>0.4){
  me.angle=Math.atan2(me.vy,me.vx);
 }
}

/* ==========================================
   HOST BALL PHYSICS
========================================== */

let lastPublish=0;
let lastTick=0;
let lastHostUpdate=0;
let previous=0;

function resetBall(){
 ball={x:800,y:280,vx:0,vy:0};
}

function hostPhysics(dt){
 if(!isHost||!roomData||roomData.status!=="playing")return;

 const step=dt*60;

 ball.vy+=0.38*step;
 ball.x+=ball.vx*step;
 ball.y+=ball.vy*step;

 ball.vx*=0.997;
 ball.vy*=0.997;

 if(ball.y>H-100){
  ball.y=H-100;
  ball.vy=-Math.abs(ball.vy)*0.76;
 }

 if(ball.y<45){
  ball.y=45;
  ball.vy=Math.abs(ball.vy)*0.8;
 }

 for(const player of Object.values(players)){
  const dx=ball.x-(player.x||0);
  const dy=ball.y-(player.y||0);
  const distance=Math.hypot(dx,dy);

  if(distance<70&&distance>0){
   const nx=dx/distance;
   const ny=dy/distance;

   ball.x+=nx*(70-distance);
   ball.y+=ny*(70-distance);

   ball.vx+=nx*5;
   ball.vy+=ny*5;
  }
 }

 if(ball.x<45){
  if(ball.y>330&&ball.y<650){
   scores.orange=(scores.orange||0)+1;
   resetBall();
  }else{
   ball.x=45;
   ball.vx=Math.abs(ball.vx)*0.8;
  }
 }

 if(ball.x>W-45){
  if(ball.y>330&&ball.y<650){
   scores.blue=(scores.blue||0)+1;
   resetBall();
  }else{
   ball.x=W-45;
   ball.vx=-Math.abs(ball.vx)*0.8;
  }
 }

 if(Date.now()-lastTick>=1000){
  lastTick=Date.now();
  timeLeft=Math.max(0,timeLeft-1);

  if(timeLeft===0){
   finishHostMatch();
  }
 }

 if(Date.now()-lastHostUpdate>=65){
  lastHostUpdate=Date.now();

  update(roomRef,{
   ball,
   score:scores,
   timeLeft
  }).catch(console.error);
 }
}

let finishing=false;

async function finishHostMatch(){
 if(finishing)return;
 finishing=true;

 try{
  await update(roomRef,{
   status:"finished",
   ball,
   score:scores,
   timeLeft:0
  });
 }catch(error){
  console.error(error);
 }
}

/* ==========================================
   ARENA RENDERING
========================================== */

function roundedRect(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function drawArena(){
 const gradient=ctx.createLinearGradient(0,0,0,H);
 gradient.addColorStop(0,"#102341");
 gradient.addColorStop(1,"#081326");

 ctx.fillStyle=gradient;
 ctx.fillRect(0,0,W,H);

 for(let i=0;i<30;i++){
  ctx.fillStyle=i%2?"#18385a":"#142b49";
  ctx.fillRect(i*56,120,26,170);
 }

 ctx.fillStyle="#132b46";
 ctx.fillRect(0,650,W,250);

 const floor=ctx.createLinearGradient(0,650,0,900);
 floor.addColorStop(0,"#174c62");
 floor.addColorStop(1,"#10243b");

 ctx.fillStyle=floor;
 ctx.fillRect(0,650,W,250);

 ctx.strokeStyle="#6bb8d7";
 ctx.lineWidth=4;
 ctx.beginPath();
 ctx.moveTo(0,650);
 ctx.lineTo(W,650);
 ctx.stroke();

 ctx.beginPath();
 ctx.arc(800,650,110,Math.PI,0);
 ctx.stroke();

 ctx.fillStyle="#208bff55";
 ctx.fillRect(0,330,65,320);

 ctx.fillStyle="#ff974455";
 ctx.fillRect(W-65,330,65,320);

 ctx.strokeStyle="#47baff";
 ctx.lineWidth=9;
 ctx.strokeRect(8,330,50,320);

 ctx.strokeStyle="#ff9c53";
 ctx.strokeRect(W-58,330,50,320);

 ctx.strokeStyle="#ffffff17";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(800,330);
 ctx.lineTo(800,650);
 ctx.stroke();
}

function drawCar(player,team,name,isLocal=false){
 const x=player.x;
 const y=player.y;

 const blue=team===0;
 const color=blue?"#36baff":"#ff984c";

 const asset=images[blue?"blueCar":"orangeCar"];

 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(player.angle||0);

 if(asset?.complete&&asset.naturalWidth){
  ctx.drawImage(asset,-62,-32,124,64);
 }else{
  ctx.shadowBlur=18;
  ctx.shadowColor=color;

  roundedRect(-55,-23,110,39,13,color);

  ctx.shadowBlur=0;

  roundedRect(-22,-42,49,28,10,
   blue?"#a6e8ff":"#ffd0a3");

  roundedRect(-17,-37,37,17,5,"#18324d");

  roundedRect(36,-13,14,12,4,"#fff1be");

  roundedRect(-54,-13,12,12,3,"#ffdf87");

  for(const wheel of [-33,35]){
   ctx.fillStyle="#07111e";
   ctx.beginPath();
   ctx.arc(wheel,18,13,0,Math.PI*2);
   ctx.fill();

   ctx.strokeStyle="#8aa3bd";
   ctx.lineWidth=4;
   ctx.beginPath();
   ctx.arc(wheel,18,6,0,Math.PI*2);
   ctx.stroke();
  }

  ctx.fillStyle="#ffffff";
  ctx.font="bold 11px Arial";
  ctx.textAlign="center";
  ctx.fillText("TR",0,-8);
 }

 ctx.restore();

 ctx.fillStyle="#fff";
 ctx.font="bold 16px Arial";
 ctx.textAlign="center";
 ctx.fillText(name||"Racer",x,y-54);

 if(isLocal){
  ctx.fillStyle="#7de2ff";
  ctx.font="bold 10px Arial";
  ctx.fillText("YOU",x,y-68);
 }
}

function drawBall(){
 ctx.save();

 ctx.shadowBlur=24;
 ctx.shadowColor="#ffffff";

 const gradient=ctx.createRadialGradient(
  ball.x-9,ball.y-10,3,
  ball.x,ball.y,27
 );

 gradient.addColorStop(0,"#ffffff");
 gradient.addColorStop(1,"#9bb8d0");

 ctx.fillStyle=gradient;
 ctx.beginPath();
 ctx.arc(ball.x,ball.y,26,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#536b85";
 ctx.lineWidth=3;
 ctx.stroke();

 ctx.restore();
}

function render(){
 ctx.setTransform(1,0,0,1,0,0);
 ctx.clearRect(0,0,canvas.width,canvas.height);

 ctx.setTransform(scale,0,0,scale,offsetX,offsetY);

 drawArena();
 drawBall();

 for(const [uid,player] of Object.entries(players)){
  if(uid===user?.uid)continue;
  drawCar(player,player.slot,player.name);
 }

 drawCar(me,slot,playerName(),true);
}

/* ==========================================
   GAME LOOP
========================================== */

function loop(timestamp){
 if(!active)return;

 const dt=Math.min((timestamp-previous)/1000||0.016,0.04);
 previous=timestamp;

 updateCar(dt);

 if(Date.now()-lastPublish>90){
  lastPublish=Date.now();

  if(roomRef&&user){
   update(
    ref(db,`rooms/${roomId}/players/${user.uid}`),
    {
     x:me.x,
     y:me.y,
     vx:me.vx,
     vy:me.vy,
     angle:me.angle,
     boost:me.boost
    }
   ).catch(console.error);
  }
 }

 hostPhysics(dt);
 render();

 requestAnimationFrame(loop);
}

/* ==========================================
   FINISH MATCH
========================================== */

function finishMatch(){
 if(matchEnded)return;

 matchEnded=true;
 active=false;

 const winner=
  scores.blue===scores.orange?"DRAW":
  scores.blue>scores.orange?"BLUE WINS!":"ORANGE WINS!";

 $("message").textContent=winner;

 setTimeout(()=>leaveMatch(true),3500);
}

async function leaveMatch(removeRoom=true){
 active=false;
 searching=false;

 clearInterval(waitTimer);

 if(unsubscribe){
  unsubscribe();
  unsubscribe=null;
 }

 if(roomRef&&user){
  try{
   if(removeRoom&&isHost){
    await remove(roomRef);
   }else{
    await remove(ref(
     db,`rooms/${roomId}/players/${user.uid}`
    ));

    if(isHost){
     await update(roomRef,{
      status:"waiting",
      hostUid:null
     });
    }
   }
  }catch(error){
   console.error(error);
  }
 }

 roomRef=null;
 roomId=null;
 roomData=null;
 finishing=false;

 $("game").classList.add("hidden");
 $("menu").classList.remove("hidden");
 $("message").textContent="";
 $("play").disabled=!connected;

 status(connected?"Connected · Ready to play":"Disconnected");
}

$("exit").addEventListener("click",()=>leaveMatch());

document.addEventListener("visibilitychange",()=>{
 if(document.hidden){
  for(const key of Object.keys(keys)){
   keys[key]=false;
  }
 }
});

</script>
